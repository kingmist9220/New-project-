<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b8def">
  <meta name="description" content="A calm, predictable learning and habits app for autistic children.">
  <title>Learning Buddy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="home-btn" aria-label="Go home" hidden>🏠</button>
    <h1 id="title">Learning Buddy</h1>
    <div class="stars" aria-live="polite"><span aria-hidden="true">⭐</span> <span id="star-count">0</span></div>
    <button class="icon-btn hold" id="settings-btn" aria-label="Grown-up settings (press and hold)">⚙️<span class="hold-ring"></span></button>
  </header>
  <main id="app" tabindex="-1"></main>
  <noscript>Learning Buddy needs JavaScript turned on.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
