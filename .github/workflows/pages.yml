# Publishes the Learning Buddy app (learning-buddy/) to GitHub Pages.
name: Deploy Learning Buddy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['learning-buddy/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning-buddy
      - id: deployment
        uses: actions/deploy-pages@v4
